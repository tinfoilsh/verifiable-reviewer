cvm-version: 0.10.1
cpus: 2
memory: 2048

networks:
  web:
    egress: allowlist
    allow:
      - inference.tinfoil.sh # LLM
      - rekor.sigstore.dev # transparency log
      - github.com # diff fetch (compare/<a>...<b>.diff)
      - codeload.github.com # github.com 302s here for the diff body

containers:
  - name: "verifiable-reviewer"
    image: "ghcr.io/tinfoilsh/verifiable-reviewer@sha256:73018e35bdb97e8642ffbe90b90cd25116014efc6f2d9a9890d14866df0713ce" # v0.0.3
    networks: [web]
    user: "0:0" # run as root so we can read the 0600 TLS key bind-mounted below
    secrets:
      - TINFOIL_API_KEY
      - REVIEWER_API_KEY
    volumes:
      - /mnt/ramdisk/private/tls/key.pem:/tinfoil-app/tls.key:ro # boot-time TLS key for in-container signing

shim:
  listen-port: 443
  upstream-port: 8080
  paths:
    - /review
    - /healthz
  authenticated: false # /review enforces its own bearer-token; shim auth would double-charge keys
