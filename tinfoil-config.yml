cvm-version: 0.10.1
cpus: 2
memory: 2048

networks:
  web:
    egress: open # TEMP: allowlist doesn't support IPv6 yet

containers:
  - name: "verifiable-reviewer"
    image: "ghcr.io/tinfoilsh/verifiable-reviewer@sha256:bc76bc582efd0ff6479e30a60439513a45445f5102c39538f4c3215dd93ebb8d" # v0.0.5
    networks: [web]
    user: "0:0" # run as root so we can read the 0600 TLS key bind-mounted below
    secrets:
      - TINFOIL_API_KEY
      - REVIEWER_API_KEY
    volumes:
      - /mnt/ramdisk/private/tls/key.pem:/tinfoil-app/tls.key:ro # boot-time TLS key for in-container signing
      - /mnt/ramdisk/private/tls/cert.pem:/tinfoil-app/tls.crt:ro # matching cert; its sha256 goes into the predicate as a CT pointer

shim:
  listen-port: 443
  upstream-port: 8080
  paths:
    - /review
    - /healthz
  authenticated: false # /review enforces its own bearer-token; shim auth would double-charge keys
