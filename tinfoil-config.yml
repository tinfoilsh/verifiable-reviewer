cvm-version: 0.10.1
cpus: 2
memory: 2048

networks:
  web:
    egress: open # TEMP: allowlist doesn't support IPv6 yet

containers:
  - name: "verifiable-reviewer"
    image: "ghcr.io/tinfoilsh/verifiable-reviewer@sha256:dc4c78f7298b33bc9448f6e218e4612189996ca20138cf2a8e843e8f757751c6" # v0.0.4
    networks: [web]
    user: "0:0" # run as root so we can read the 0600 TLS key bind-mounted below
    secrets:
      - TINFOIL_API_KEY
      - REVIEWER_API_KEY
    volumes:
      - /mnt/ramdisk/private/tls/key.pem:/tinfoil-app/tls.key:ro # boot-time TLS key for in-container signing

shim:
  listen-port: 443
  upstream-port: 8080
  paths:
    - /review
    - /healthz
  authenticated: false # /review enforces its own bearer-token; shim auth would double-charge keys
